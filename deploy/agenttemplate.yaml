# Reusable base template — shared infrastructure config (images, credentials, contexts).
# Individual Agents reference this template and override only what differs.
apiVersion: kubeopencode.io/v1alpha1
kind: AgentTemplate
metadata:
  name: kubeopencode-base
spec:
  agentImage: quay.io/kubeopencode/kubeopencode-agent-opencode:latest
  executorImage: quay.io/kubeopencode/kubeopencode-agent-devbox:latest
  workspaceDir: /workspace
  serviceAccountName: kubeopencode-agent
  podSpec:
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "4Gi"
        cpu: "2000m"
    extraEnv:
      - name: PATH
        value: "/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  contexts:
    # Agent repo at workspace root - AGENTS.md, skills, workflows auto-discovered
    # Reference repos (kubeopencode, skills, etc.) are managed via repos/repos.yaml
    # and cloned on demand by sync-repos.sh — no separate git context needed.
    - name: kubeopencode-agent
      description: "Agent repo with skills, workflows, and instructions"
      type: Git
      git:
        repository: https://github.com/kubeopencode/kubeopencode-agent.git
        ref: main
        sync:
          enabled: true
          interval: 5m
          policy: HotReload
      mountPath: .
  config:
    model: kimi-for-coding/k2p6
    small_model: kimi-for-coding/k2p6
    share: disabled
    autoupdate: false
    agent:
      general:
        model: kimi-for-coding/k2p6
  # Proxy via Clash on K3s host
  proxy:
    httpProxy: "http://host.k3s.internal:7897"
    httpsProxy: "http://host.k3s.internal:7897"
    noProxy: "localhost,127.0.0.1,10.0.0.0/8,192.168.0.0/16"
  credentials:
    # Mount entire secret - all keys become env vars automatically
    - name: git
      secretRef:
        name: git-settings
    - name: kimi-for-coding
      secretRef:
        name: kimi-for-coding-credentials
    # GitHub App credentials (write access)
    - name: github-app
      secretRef:
        name: github-dev-credentials
    # Slack Bot Token (legacy socket-mode-gateway, kept for backward compat)
    - name: slack
      secretRef:
        name: slack-creds
        key: bot-token
      env: SLACK_BOT_TOKEN
    # Slack Socket Mode App Token (for opencode-slack-plugin)
    - name: slack-app-token
      secretRef:
        name: slack-socket-mode-creds
        key: app-token
      env: SLACK_APP_TOKEN
