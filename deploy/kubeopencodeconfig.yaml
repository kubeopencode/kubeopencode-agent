# KubeOpenCodeConfig for kubeopencode-agent
# This is a cluster-scoped singleton resource
apiVersion: kubeopencode.io/v1alpha1
kind: KubeOpenCodeConfig
metadata:
  name: cluster  # Singleton name following OpenShift convention
spec:
  # System image configuration for internal KubeOpenCode components (git-init, context-init)
  # Use Always to ensure fresh images are pulled, avoiding stale cached images on nodes
  systemImage:
    imagePullPolicy: Always

  # Automatic cleanup of completed/failed Tasks
  # - TTL: delete Tasks older than 2 days (172800 seconds) to prevent accumulation
  # - Retention: keep at most 5 completed/failed Tasks per namespace, matching
  #   CronTask.maxRetainedTasks so scheduled tasks are not blocked
  cleanup:
    ttlSecondsAfterFinished: 172800
    maxRetainedTasks: 5

  # OpenTelemetry observability
  observability:
    openTelemetry:
      enabled: true
      endpoint: "http://otel-collector.monitoring.svc.cluster.local:4318"
      recordContent: true
      resourceAttributes:
        deployment.environment: "production"
        service.namespace: "kubeopencode-agent"
